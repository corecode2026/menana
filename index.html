function renderVoting(round){
  const players = Object.entries(state.room.players).filter(([uid,p])=>p.online!==false);
  const votes = round.votes||{};
  const myVote = votes[state.uid];
  const remaining = Math.max(0, round.phaseEndAt - Date.now());
  const total = (state.room.settings.voteSeconds||25)*1000;

  appRoot().innerHTML = `<div class="wrap"><div class="center-stage" style="max-width:460px;">
    <div class="phase-eyebrow">من برأيك "المختلف"؟</div>
    ${timerRingHTML(true)}
    <div class="vote-grid">
      ${players.map(([uid,p])=>`
        <button class="vote-card ${myVote===uid?'selected':''} ${uid===state.uid||myVote?'disabled':''}" data-uid="${uid}" ${uid===state.uid?'disabled':''}>
          <div class="avatar" style="background:${avatarColor(uid)}">${escapeHTML(initials(p.name))}</div>
          <div class="name">${escapeHTML(p.name)}</div>
          ${myVote===uid?svgIcon('check'):''}
        </button>`).join('')}
    </div>
    <div class="vote-count-note">${Object.keys(votes).length} من ${players.length} صوّتوا${myVote?' — تم تسجيل تصويتك':''}</div>
    ${state.isHost ? `<button class="btn btn-secondary btn-sm" id="end-voting-now" style="margin-top:14px;">⏹ إنهاء التصويت الآن</button>` : ''}
  </div></div>`;

  startRingCountdown(total, remaining, ()=>{});

  if(!myVote){
    document.querySelectorAll('.vote-card').forEach(btn=>{
      btn.onclick = ()=>{ if(btn.dataset.uid!==state.uid) submitVote(btn.dataset.uid); };
    });
  }
  const endBtn = document.getElementById('end-voting-now');
  if(endBtn) endBtn.onclick = function(){ this.disabled = true; this.textContent = 'جارِ الإنهاء…'; finishVoting(); };
}

  const players = state.room.players;

  if(majorityCaught) launchConfetti();

  appRoot().innerHTML = `<div class="wrap"><div class="center-stage" style="max-width:460px;">
    <div class="result-banner ${majorityCaught?'result-win':'result-lose'}">

  </div></div>`;

  if(state.isHost) document.getElementById('next-btn').onclick = nextRoundOrFinish;
}

/* ---- الكراسي الموسيقية: شاشات المراحل ---- */
function renderChairsMusic(round){
  const players = round.allPlayers.map(uid=>[uid, state.room.players[uid]]).filter(([uid,p])=>p);
  appRoot().innerHTML = `<div class="wrap"><div class="center-stage" style="max-width:460px;">
    <div class="phase-eyebrow">الجولة ${round.index}</div>

    <div class="section-title" style="width:100%;">اللاعبون (${players.length})</div>
    <div class="player-list" style="width:100%;">
      ${players.map(([uid,p])=>`
        <div class="player-card">
          <div class="avatar" style="background:${avatarColor(uid)}">${escapeHTML(initials(p.name))}</div>
          <div class="name">${escapeHTML(p.name)}</div>
        </div>`).join('')}
    </div>

    <div class="eq-bars">${'<div class="bar"></div>'.repeat(5)}</div>
    <h2 style="font-size:20px;">الموسيقى تشتغل 🎵</h2>
    ${round.songName ? `<div class="hint-row" style="justify-content:center;">${svgIcon('info')}${escapeHTML(round.songName)}</div>` : ''}
    <div class="hint-row" style="justify-content:center;">${svgIcon('info')}استعدوا للجلوس بسرعة لحظة ما تتوقف — ما حدا بيعرف الوقت غير الحظ!</div>
    <button class="btn btn-secondary btn-sm" id="tap-to-play" style="display:none; margin-top:6px;">🔊 اضغط لتشغيل الصوت</button>
    <div class="warn-msg" id="audio-warn"></div>

    <div class="hint-row" style="justify-content:center; margin-top:10px;">${svgIcon('info')}الموسيقى رح توقف لحالها بلحظة عشوائية…</div>
  </div></div>`;

  if(round.songUrl){
    const audio = state.chairsAudioEl || new Audio();
    if(!state.chairsAudioEl) state.chairsAudioEl = audio;
    audio.loop = true;
    audio.src = round.songUrl;
    audio.currentTime = 0;
    const tryPlayBtn = document.getElementById('tap-to-play');
    const warnEl = document.getElementById('audio-warn');
    const showFallback = ()=>{
      if(tryPlayBtn) tryPlayBtn.style.display = 'inline-flex';
    };
    audio.onerror = ()=>{
      console.error('[chairs audio] failed to load:', round.songUrl);
      if(warnEl) warnEl.textContent = 'تعذر تحميل الأغنية — تأكد إن الرابط ملف صوتي مباشر';

      console.warn('[chairs audio] autoplay blocked:', err);
      showFallback();
      if(tryPlayBtn) tryPlayBtn.onclick = ()=>{ audio.play().catch(()=>{}); tryPlayBtn.style.display='none'; };
    });

}

/* يوقف أي صوت شغّال محلياً عند مغادرة مرحلة الموسيقى (تغيّر الشاشة بيشيل العنصر تلقائياً، بس هذا احتياط إضافي) */
function stopLocalChairsAudio(){
  if(state.chairsAudioEl){ try{ state.chairsAudioEl.pause(); }catch(e){} }

/* يعرض صورة حقيقية إن وُجدت (imageUrl)، وإلا يرجع لواجهة الإيموجي + الكلمة */
function pictureCardHTML(item, extraClass){
  if(!item) return `<div class="word-card ${extraClass||''}"><div class="emoji">❔</div></div>`;
  if(item.imageUrl){
    return `<div class="word-card ${extraClass||''}">
      <img class="photo-fill" src="${escapeHTML(item.imageUrl)}" alt="">
      ${item.word ? `<div class="photo-caption">${escapeHTML(item.word)}</div>` : ''}
    </div>`;
  }
  return `<div class="word-card ${extraClass||''}">
    <div class="emoji">${item.emoji||'❔'}</div>
    <div class="word">${escapeHTML(item.word||'')}</div>
  </div>`;
}

function renderGuessPlaying(round){
  const opponentUid = Object.keys(state.room.players).find(uid=>uid!==state.uid);

  const guesses = round.guesses||{};
  const verdicts = round.verdicts||{};
  const myGuess = guesses[state.uid];
  const opponentGuess = guesses[opponentUid];
  const myVerdict = verdicts[state.uid];
  const opponentNeedsVerdict = opponentGuess && verdicts[opponentUid]===undefined;

  if(myVerdict===false){ clearMyGuess(); }

  const total = (state.room.settings.roundSeconds||0)*1000;
  const remaining = round.phaseEndAt ? Math.max(0, round.phaseEndAt-Date.now()) : 0;

  appRoot().innerHTML = `<div class="wrap"><div class="center-stage" style="max-width:460px;">
    <div class="phase-eyebrow">صورة خصمك — جاوب عن أسئلته فيها</div>
    ${total>0 ? timerRingHTML() : `<div class="hint-row" style="justify-content:center;">${svgIcon('info')}بلا حد للوقت</div>`}
    ${pictureCardHTML(myPic)}
    <div class="hint-row" style="justify-content:center;">${svgIcon('info')}صورتك انت مخفية عنك — اسأل خصمك أسئلة نعم/لا لتعرفها</div>

    ${opponentGuess ? `
      <div class="turn-banner" style="width:100%;">
        <div class="phase-eyebrow">خصمك خمّن</div>
        <div class="who" style="font-size:17px;">"${escapeHTML(opponentGuess)}"</div>
        ${opponentNeedsVerdict ? `
          <div class="btn-row" style="margin-top:14px;">
            <button class="btn btn-primary" id="verdict-yes">✅ صحيح</button>
            <button class="btn btn-danger" id="verdict-no">❌ خطأ</button>
          </div>` : `<div class="hint-row" style="justify-content:center; margin-top:8px;">${svgIcon('info')}${verdicts[opponentUid]?'أكدت إنه صحيح':'أكدت إنه خطأ'}</div>`}
      </div>` : ''}

    ${myGuess ? `
      <div class="hint-row" style="justify-content:center;">${svgIcon('info')}بانتظار خصمك يأكد تخمينك: "${escapeHTML(myGuess)}"</div>
    ` : `
      <div class="field" style="width:100%;">
        <input id="guess-input" placeholder="شو رأيك انو صورتك؟" maxlength="60">
      </div>
      <button class="btn btn-primary" id="guess-submit" style="width:100%;">${svgIcon('send')}أعلن تخمينك</button>

    ${state.isHost ? `<button class="btn btn-secondary btn-sm" id="end-round-now" style="margin-top:10px;">⏹ إنهاء الجولة الآن (إظهار الصورتين)</button>` : ''}
  </div></div>`;

  if(total>0) startRingCountdown(total, remaining, ()=>{});

  if(opponentNeedsVerdict){
    document.getElementById('verdict-yes').onclick = ()=> submitVerdict(opponentUid, true);
    document.getElementById('verdict-no').onclick = ()=> submitVerdict(opponentUid, false);
  }
  if(!myGuess){
    const input = document.getElementById('guess-input');
    const submit = ()=> submitGuess(input.value);
    document.getElementById('guess-submit').onclick = submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }

  const opponentUid = Object.keys(state.room.players).find(uid=>uid!==state.uid);

function renderDrawPhase(round){
  const isDrawer = state.uid === round.drawerUid;
  const drawerName = (state.room.players[round.drawerUid]||{}).name || '';
  const others = Object.entries(state.room.players).filter(([uid,p])=>uid!==round.drawerUid && p.online!==false);
  const total = (state.room.settings.drawSeconds||75)*1000;
  const remaining = Math.max(0, round.phaseEndAt-Date.now());
  const myWord = state.myAssignment;

  appRoot().innerHTML = `<div class="wrap"><div class="center-stage" style="max-width:520px;">
    <div class="phase-eyebrow">الجولة ${round.index} — يرسم: ${escapeHTML(drawerName)}</div>
    ${timerRingHTML()}
    ${isDrawer
      ? `<div class="draw-word-banner">ارسم: ${escapeHTML(myWord?myWord.word:'')} ${myWord&&myWord.emoji?myWord.emoji:''}</div>`
      : `<div class="hint-row" style="justify-content:center;">${svgIcon('info')}خمّن بصوتك عالمكالمة!</div>`}

    <div class="canvas-wrap"><canvas id="draw-canvas" width="600" height="400"></canvas></div>

    ${isDrawer ? `
      <div class="color-row" id="color-row">
        ${["#1a1a1a","#e63946","#2a9d8f","#f4a300","#3a86ff","#ffffff"].map((c,i)=>`<button class="color-dot ${i===0?'active':''}" data-c="${c}" style="background:${c};"></button>`).join('')}
      </div>
      <button class="btn btn-secondary btn-sm" id="clear-canvas" style="margin-top:6px;">🧹 امسح الكل</button>
      <button class="btn btn-primary btn-sm" id="finish-round-btn" style="margin-top:6px;">✅ إنهاء الجولة الآن</button>

      <div class="section-title" style="width:100%;">مين خمّن صح؟ (اضغط لما تسمعه يخمّن صح بصوته)</div>
      <div class="player-list" style="width:100%;">
        ${others.map(([uid,p])=>`
          <button class="player-card guess-btn" data-uid="${uid}" style="width:100%; text-align:right; border:none; cursor:pointer;">
            <div class="avatar" style="background:${avatarColor(uid)}">${escapeHTML(initials(p.name))}</div>
            <div class="name" style="flex:1;">${escapeHTML(p.name)}</div>
            <span class="guess-mark-${uid}"></span>
          </button>`).join('')}
      </div>
    ` : `
      <div class="section-title" style="width:100%;">اللاعبون</div>
      <div class="player-list" style="width:100%;">
        ${others.filter(([uid])=>uid!==state.uid).map(([uid,p])=>`
          <div class="player-card">
            <div class="avatar" style="background:${avatarColor(uid)}">${escapeHTML(initials(p.name))}</div>
            <div class="name">${escapeHTML(p.name)}</div>
          </div>`).join('')}
      </div>
    `}
  </div></div>`;

  startRingCountdown(total, remaining, ()=>{});

  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  function paintSegment(s){
    ctx.strokeStyle = s.c; ctx.lineWidth = s.s;
    ctx.beginPath();
    ctx.moveTo(s.x0*canvas.width, s.y0*canvas.height);
    ctx.lineTo(s.x1*canvas.width, s.y1*canvas.height);
    ctx.stroke();
  }

  detachDrawListeners();
  const strokesRef = db.ref(`rooms/${state.roomCode}/round/strokes`);
  const onStroke = snap=>{ const s = snap.val(); if(s) paintSegment(s); };
  strokesRef.on('child_added', onStroke);
  state.drawListeners.push([strokesRef, 'child_added', onStroke]);

  let lastClearSeq = round.clearSeq||0;
  const clearRef = db.ref(`rooms/${state.roomCode}/round/clearSeq`);
  const onClear = snap=>{
    const v = snap.val();
    if(v!==null && v!==undefined && v!==lastClearSeq){
      lastClearSeq = v;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    }
  };
  clearRef.on('value', onClear);
  state.drawListeners.push([clearRef, 'value', onClear]);

  if(isDrawer){
    let color = "#1a1a1a", size = 5;
    document.querySelectorAll('.color-dot').forEach(btn=>{
      btn.onclick = ()=>{
        color = btn.dataset.c; size = (btn.dataset.c==="#ffffff") ? 16 : 5; // أبيض = ممحاة تقريباً
        document.querySelectorAll('.color-dot').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    document.getElementById('clear-canvas').onclick = async ()=>{
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      const newSeq = (round.clearSeq||0)+1;
      lastClearSeq = newSeq;
      round.clearSeq = newSeq;
      await db.ref(`rooms/${state.roomCode}/round/clearSeq`).set(newSeq);
      await db.ref(`rooms/${state.roomCode}/round/strokes`).set(null);
    };
    document.getElementById('finish-round-btn').onclick = function(){
      this.disabled = true; this.textContent = 'جارِ الإنهاء…';
      requestFinishDrawRound();
    };

    let drawing=false, lastX=0, lastY=0;
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height};
    }
    canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); drawing=true; const p=pos(e); lastX=p.x; lastY=p.y; });
    canvas.addEventListener('pointermove', e=>{
      if(!drawing) return; e.preventDefault();
      const p = pos(e);
      db.ref(`rooms/${state.roomCode}/round/strokes`).push({x0:lastX,y0:lastY,x1:p.x,y1:p.y,c:color,s:size});
      lastX = p.x; lastY = p.y;
    });
    window.addEventListener('pointerup', ()=>{ drawing=false; });

    document.querySelectorAll('.guess-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const uid = btn.dataset.uid;
        markGuesserCorrect(uid);
        const mark = btn.querySelector(`.guess-mark-${uid}`);
        if(mark) mark.textContent = '✅';
        btn.disabled = true; btn.style.opacity = '0.55';
      };
    });
  }
}

/* ---- timer ring helper ---- */
function timerRingHTML(small){
  const size = small?76:96, r=size/2-6;
  return `<div class="timer-ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
      <circle id="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${2*Math.PI*r}" stroke-dashoffset="0"/>
      <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bff"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
    </svg>
    <div class="tval" id="ring-val">--</div>
  </div>`;
}
function startRingCountdown(totalMs, remainingMs, onZero){
  const ring = document.getElementById('ring-fg');
  const val = document.getElementById('ring-val');
  if(!ring||!val) return;
  const r = ring.getAttribute('r'); const circumference = 2*Math.PI*r;
  let done=false;
  function tick(){
    const left = Math.max(0, remainingMsLive());
    const secs = Math.ceil(left/1000);
    val.textContent = secs;
    const frac = totalMs>0 ? Math.max(0, left/totalMs) : 0;
    ring.style.strokeDashoffset = circumference*(1-frac);
    if(left<=0 && !done){ done=true; onZero&&onZero(); clearTimer(); }
  }
  const endAt = Date.now()+remainingMs;
  function remainingMsLive(){ return endAt - Date.now(); }
  tick();
  state.timerInterval = setInterval(tick, 200);
}

  const displayName = state.name || (user && user.displayName) || '';
  return `<header class="topbar">
    <button class="topbar-brand" id="topbar-logo">${svgLogo()}<span>منصّة الألعاب</span></button>
    <nav class="topbar-nav">
      <button id="nav-home">الرئيسية</button>
      <button id="nav-games">الألعاب</button>
    </nav>
    <div class="topbar-auth">
      ${signedInGoogle ? `
        <button class="topbar-user" id="user-menu-btn">
          ${user.photoURL ? `<img src="${escapeHTML(user.photoURL)}" class="topbar-avatar" alt="">` : `<div class="topbar-avatar-fallback">${escapeHTML(initials(displayName))}</div>`}
          <span class="topbar-username">${escapeHTML(displayName)}</span>

        </button>
        <div class="user-menu" id="user-menu">
          <button id="menu-profile">${svgIcon('user')}الملف الشخصي</button>
          <button id="menu-logout">${svgIcon('logout')}تسجيل الخروج</button>

      `}

}

function wireTopbar(){
  const logo = document.getElementById('topbar-logo'); if(logo) logo.onclick = renderHome;
  const navHome = document.getElementById('nav-home'); if(navHome) navHome.onclick = renderHome;
  const navGames = document.getElementById('nav-games'); if(navGames) navGames.onclick = ()=>{
    renderHome();
    setTimeout(()=>{ const g=document.querySelector('.game-grid'); if(g) g.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
  };
  const gsi = document.getElementById('google-signin'); if(gsi) gsi.onclick = signInWithGoogle;
  const menuBtn = document.getElementById('user-menu-btn');
  const menu = document.getElementById('user-menu');
  if(menuBtn && menu){
    menuBtn.onclick = e=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    document.addEventListener('click', ()=> menu.classList.remove('open'), {once:true});
  }
  const mp = document.getElementById('menu-profile'); if(mp) mp.onclick = renderProfile;
  const ml = document.getElementById('menu-logout'); if(ml) ml.onclick = signOutUser;
}

/* ---- custom dropdown: builds markup, then wireDropdown() attaches behavior after insertion ---- */
function ddHTML(id, options, selectedValue){
  const sel = options.find(o=>String(o.v)===String(selectedValue)) || options[0];
  return `<div class="dd" id="${id}">
    <button type="button" class="dd-trigger"><span class="dd-label">${escapeHTML(sel?sel.label:'')}</span>${svgIcon('chevron')}</button>
    <div class="dd-menu">
      ${options.map(o=>`<div class="dd-item ${String(o.v)===String(selectedValue)?'selected':''}" data-v="${escapeHTML(String(o.v))}">${escapeHTML(o.label)}</div>`).join('')}
    </div>
  </div>`;
}
function wireDropdown(id, onSelect){
  const dd = document.getElementById(id);
  if(!dd) return;
  const trigger = dd.querySelector('.dd-trigger');
  const label = dd.querySelector('.dd-label');
  trigger.onclick = e=>{
    e.stopPropagation();
    document.querySelectorAll('.dd.open').forEach(o=>{ if(o!==dd) o.classList.remove('open'); });
    dd.classList.toggle('open');
  };
  dd.querySelectorAll('.dd-item').forEach(item=>{
    item.onclick = e=>{
      e.stopPropagation();
      dd.querySelectorAll('.dd-item').forEach(i=>i.classList.remove('selected'));
      item.classList.add('selected');
      label.textContent = item.textContent;
      dd.classList.remove('open');
      onSelect(item.dataset.v);
    };
  });
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); });

/* =========================================================================
   خلفية جسيمات بسيطة (particle background)
   ========================================================================= */
(function particles(){
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W,H,pts=[];
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  resize(); addEventListener('resize', resize);
  const N = Math.min(46, Math.floor((innerWidth*innerHeight)/26000));
  for(let i=0;i<N;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*0.25,vy:(Math.random()-.5)*0.25,r:Math.random()*1.6+0.6});
  const colors = ['124,92,255','34,211,238'];
  function frame(){
    ctx.clearRect(0,0,W,H);
    pts.forEach((p,i)=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath(); ctx.fillStyle=`rgba(${colors[i%2]},0.5)`; ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
})();

/* ---- confetti ---- */
function launchConfetti(){
  if(launchConfetti._running) return;
  launchConfetti._running = true;
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ['#7c5cff','#22d3ee','#ff8a4c','#3ddc97','#ffd166'];
  const pieces = Array.from({length:90}, ()=>({
    x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.3,
    vx:(Math.random()-.5)*2.5, vy:2+Math.random()*3, size:5+Math.random()*5,
    color:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*360, vr:(Math.random()-.5)*10
  }));
  let frames=0;
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    frames++;
    if(frames<140){ requestAnimationFrame(tick); } else { ctx.clearRect(0,0,canvas.width,canvas.height); launchConfetti._running=false; }
  }
  tick();
}

   بدء التشغيل
   ========================================================================= */
(async function init(){
  await ensureAuth();
  await loadGameData();

  const params = new URLSearchParams(location.search);
  const roomFromLink = params.get('room');

  const savedTrivia = !roomFromLink ? loadTriviaLocalFromStorage() : null;
  if(savedTrivia && savedTrivia.cells && savedTrivia.cells.length){
    state.triviaLocal = savedTrivia;
    if(savedTrivia.screen==="question" && savedTrivia.currentCell) renderTriviaLocalQuestion();
    else if(savedTrivia.screen==="prequestion" && savedTrivia.currentCell) renderTriviaPreQuestion();
    else renderTriviaLocalBoard();
    return;
  }

  if(roomFromLink){
    renderJoin();
    setTimeout(()=>{ const c=document.getElementById('code'); if(c) c.value=roomFromLink; }, 50);
  } else {
    renderHome();
  }
})();
</script>
