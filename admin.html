<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — منصّة الألعاب</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --bg-0:#080a10; --panel:rgba(255,255,255,0.045); --panel-strong:rgba(255,255,255,0.075);
  --border:rgba(255,255,255,0.09); --text:#eef0f8; --text-dim:#8a90a6;
  --violet:#7c5cff; --violet-2:#a78bff; --cyan:#22d3ee; --amber:#ff8a4c; --danger:#ff5470; --success:#3ddc97;
  --font-display:'Cairo',sans-serif; --font-body:'Tajawal',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:radial-gradient(1100px 700px at 15% -10%, rgba(124,92,255,0.12), transparent 60%), var(--bg-0);
  color:var(--text); font-family:var(--font-body); min-height:100vh; padding:24px 16px 60px;
}
h1,h2,h3{font-family:var(--font-display);}
.wrap{max-width:760px; margin:0 auto;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:22px; margin-bottom:18px; backdrop-filter:blur(14px);}
.header{text-align:center; margin-bottom:24px;}
.header h1{font-size:23px; font-weight:900;}
.header p{color:var(--text-dim); font-size:13px; margin-top:6px;}
.section-title{font-size:14px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; color:var(--violet-2);}

input, select{
  font-family:var(--font-body); width:100%; padding:12px 14px; border-radius:10px;
  background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text); font-size:15px; outline:none;
}
input:focus, select:focus{border-color:var(--violet-2);}
label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field{margin-bottom:14px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

button{font-family:var(--font-body); cursor:pointer; border:none;}
.btn{padding:11px 18px; border-radius:10px; font-weight:700; font-size:14px; transition:filter .15s ease, transform .1s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--violet), #6a4bff); color:#fff;}
.btn-secondary{background:var(--panel-strong); color:var(--text); border:1px solid var(--border);}
.btn-danger{background:rgba(255,84,112,0.14); color:#ff8fa3; border:1px solid rgba(255,84,112,0.3);}
.btn-sm{padding:8px 12px; font-size:12.5px;}
.btn-icon{width:40px; height:40px; border-radius:10px; background:rgba(255,84,112,0.12); color:#ff8fa3; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}

/* ---- tabs ---- */
.tabs{display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:2px;}
.tabs::-webkit-scrollbar{height:4px;}
.tab-btn{padding:11px 18px; border-radius:11px; background:var(--panel); border:1px solid var(--border); color:var(--text-dim); font-weight:800; font-size:13.5px; white-space:nowrap; flex-shrink:0;}
.tab-btn.active{background:var(--violet); color:#fff; border-color:var(--violet);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.cat-block{border:1px solid var(--border); border-radius:16px; margin-bottom:14px; overflow:hidden;}
.cat-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:rgba(255,255,255,0.04); cursor:pointer;}
.cat-head .name{font-weight:800; font-size:15px;}
.cat-head .count{color:var(--text-dim); font-size:12.5px; margin-inline-start:8px;}
.cat-body{padding:14px 16px; display:none;}
.cat-block.open .cat-body{display:block;}
.word-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
.word-row .emoji{font-size:20px; width:28px; text-align:center;}
.word-row .word{flex:1; font-size:14.5px;}
.word-row .del{color:#ff8fa3; font-size:13px; padding:4px 8px;}
.add-word-row{display:flex; gap:8px; margin-top:12px;}
.add-word-row input{flex:1;}
.add-word-row input.emoji-in{max-width:64px; text-align:center; flex:none;}
.new-cat-row{display:flex; gap:8px;}
.new-cat-row input{flex:1;}

.img-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px; margin-top:16px;}
.img-tile{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); aspect-ratio:1; background:rgba(255,255,255,0.03);}
.img-tile img{width:100%; height:100%; object-fit:cover; display:block;}
.img-tile .img-del{position:absolute; top:5px; left:5px; width:24px; height:24px; border-radius:7px; background:rgba(0,0,0,0.65); color:#ff8fa3; display:flex; align-items:center; justify-content:center; font-size:12px;}
.img-tile .img-edit{position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:7px; background:rgba(0,0,0,0.65); color:var(--violet-2); display:flex; align-items:center; justify-content:center; font-size:12px;}
.img-tile .img-label{position:absolute; bottom:0; inset-inline:0; background:rgba(0,0,0,0.65); color:#fff; font-size:10px; padding:4px 6px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.upload-status{font-size:12.5px; color:var(--text-dim); margin-top:8px; min-height:16px;}
.divider{height:1px; background:var(--border); margin:18px 0;}
.segmented{display:flex; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px;}
.segmented button{flex:1; padding:9px 6px; border:none; background:transparent; color:var(--text-dim); border-radius:9px; font-weight:700; font-size:13px;}
.segmented button.active{background:var(--panel-strong); color:var(--text);}

.gate{display:flex; align-items:center; justify-content:center; min-height:70vh; flex-direction:column; gap:16px;}
.gate .card{width:100%; max-width:360px; text-align:center;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(120%); background:#12141c; border:1px solid var(--border); padding:12px 18px; border-radius:10px; font-size:13.5px; transition:transform .3s ease; z-index:50;}
.toast.show{transform:translateX(-50%) translateY(0);}
.hint{color:var(--text-dim); font-size:12.5px; line-height:1.7; margin-bottom:14px;}
</style>
</head>
<body>

<div id="app" class="wrap"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   نفس إعدادات Firebase المستخدمة في index.html — يجب أن يبقيا متطابقين
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD7PwzxmmcMjXOOAS3y50BqOf0aX92SqV4",
  authDomain: "menal-c767a.firebaseapp.com",
  databaseURL: "https://menal-c767a-default-rtdb.firebaseio.com",
  projectId: "menal-c767a",
  storageBucket: "menal-c767a.firebasestorage.app",
  messagingSenderId: "116029089749",
  appId: "1:116029089749:web:29c271067f92643ffb3f5c"
};

/* ⚠️ غيّر هذه الكلمة قبل نشر الموقع — هذا فقط باب دخول بسيط لواجهة اللوحة */
const ADMIN_PASSWORD = "admin123";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const GAMES_META = [
  {id:"different", tab:"مين المختلف؟", defaultName:"مين المختلف؟", defaultTagline:"لعبة الذكاء والخداع — اكتشف مين ما بيعرف الكلمة"},
  {id:"chairs", tab:"الكراسي الموسيقية", defaultName:"الكراسي الموسيقية", defaultTagline:"النسخة الأونلاين من اللعبة الكلاسيكية — قف الموسيقى وكن الأسرع!"},
  {id:"guesswho", tab:"شو معي؟", defaultName:"شو معي؟", defaultTagline:"لشخصين بس — كل واحد شايف صورة التاني وعليه يسأله ليعرف شو معه"},
  {id:"draw", tab:"خمن", defaultName:"خمن", defaultTagline:"لاعب وحد يرسم كلمة سرية على لوحة مشتركة، وباقي اللاعبين يخمنوا شو هي"},
  {id:"trivia", tab:"سين جيم", defaultName:"سين جيم", defaultTagline:"فريقين يتنافسون بالإجابة على أسئلة — جاوب صح أو خلي الفريق التاني يسرق النقطة"}
];

function escapeHTML(str){ return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2400);
}

function ensureAuth(){
  return new Promise(resolve=>{
    auth.onAuthStateChanged(user=>{
      if(user) resolve(user.uid);
      else auth.signInAnonymously().catch(()=> toast("تعذر الاتصال بـ Firebase — تحقق من الإعدادات"));
    });
  });
}

function renderGate(){
  document.getElementById('app').innerHTML = `
    <div class="gate">
      <div class="card">
        <h1 style="font-size:20px; margin-bottom:6px;">لوحة تحكم اللعبة</h1>
        <p style="color:var(--text-dim); font-size:13px; margin-bottom:18px;">أدخل كلمة المرور للمتابعة</p>
        <div class="field"><input id="pw" type="password" placeholder="كلمة المرور" autofocus></div>
        <button class="btn btn-primary" id="enter" style="width:100%;">دخول</button>
      </div>
    </div>`;
  const tryEnter = ()=>{
    if(document.getElementById('pw').value === ADMIN_PASSWORD){
      sessionStorage.setItem('adminOk','1');
      renderDashboard();
    } else { toast("كلمة مرور غير صحيحة"); }
  };
  document.getElementById('enter').onclick = tryEnter;
  document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });
}

/* =========================================================================
   لوحة التحكم الرئيسية — منظّمة بتبويبات: لعبة لكل تبويب + بنك الكلمات
   ========================================================================= */
async function renderDashboard(){
  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>لوحة تحكم منصّة الألعاب</h1>

      <button class="tab-btn" data-tab="wordbank">🔤 بنك الكلمات (احتياطي)</button>

    <!-- تبويب: مين المختلف؟ -->
    <div class="tab-panel active" id="tab-different">
      <div class="card"><div class="section-title">🎮 الاسم والوصف</div><div id="name-card-different"></div></div>
      <div class="card">
        <div class="section-title">⚙️ الإعدادات الافتراضية للغرف الجديدة</div>
        <div class="field"><label>التصنيف الافتراضي</label><select id="def-different-category"><option>...</option></select></div>

        <button class="btn btn-primary btn-sm" id="save-def-different">حفظ الإعدادات الافتراضية</button>

      <div class="card">
        <div class="section-title">☁️ إعداد الرفع (مرة وحدة)</div>
        <p class="hint">عشان تقدر ترفع ملفات صوت/فيديو من جهازك مباشرة (بدون ما تحتاج فيزا أو خطة مدفوعة)، بنستخدم خدمة <strong>Cloudinary</strong> المجانية لتخزين الملفات. خطوات لمرة وحدة بس:</p>
        <p class="hint">1. سجّل حساب مجاني على <a href="https://cloudinary.com/users/register_free" target="_blank" style="color:var(--violet-2);">cloudinary.com</a> (بدون بطاقة ائتمان)<br>
        2. من لوحة التحكم تبعك هناك، انسخ <strong>Cloud name</strong> الظاهر بأعلى الصفحة<br>

        <div class="row2">
          <div class="field"><label>Cloud name</label><input id="cld-name" placeholder="مثال: dxxxxxxxx"></div>
          <div class="field"><label>Upload preset</label><input id="cld-preset" placeholder="مثال: my_unsigned_preset"></div>
        </div>
        <button class="btn btn-primary btn-sm" id="save-cloudinary">حفظ إعداد الرفع</button>
      </div>
      <div class="card">
        <div class="section-title">🎵 بنك الأغاني</div>
        <p class="hint">تُشغَّل اللعبة أغنية عشوائية من هذا البنك تلقائياً كل جولة، وتتوقف لحالها بعد مدة عشوائية (يحدّد الهوست المدى من غرفة الانتظار).</p>
        <div id="chairs-songs-list">جارِ التحميل…</div>

        <div class="upload-status" id="song-upload-status"></div>

        <div class="divider"></div>

        <div class="row2">
          <input id="new-song-url" placeholder="https://example.com/song.mp3">

        <button class="btn btn-secondary btn-sm" id="add-song" style="margin-top:10px;">+ إضافة برابط</button>

        ارفع الصورة على أي موقع استضافة صور مجاني (مثل <a href="https://imgur.com/upload" target="_blank" style="color:var(--violet-2);">imgur.com</a>) وانسخ رابطها المباشر هون.</p>

      <div class="card">
        <div class="section-title">⚙️ الإعدادات الافتراضية للغرف الجديدة</div>

      </div>
      <div class="card">
        <div class="section-title">🖼️ صور الفئات</div>

        <div class="row2">

async function loadGames(){

/* ---- بنك أسئلة سين جيم ---- */
let TRIVIA_QUESTIONS_CACHE = {};

function startEditTriviaQuestion(key){
  const q = TRIVIA_QUESTIONS_CACHE[key];
  if(!q) return;
  document.getElementById('tq-category').value = q.category || '';
  document.querySelectorAll('#tq-points button').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.v,10)===(q.points||100)));
  document.getElementById('tq-question').value = q.question || '';
  document.getElementById('tq-answer').value = q.answer || '';
  document.querySelectorAll('#tq-mediatype button').forEach(b=>b.classList.toggle('active', b.dataset.v===(q.mediaType||'none')));
  document.getElementById('tq-media-field').style.display = (q.mediaType && q.mediaType!=='none') ? 'block' : 'none';
  document.getElementById('tq-media-file').value = '';
  const addBtn = document.getElementById('add-question');
  addBtn.textContent = '💾 حفظ التعديل';
  addBtn.dataset.editKey = key;
  addBtn.dataset.editMediaUrl = q.mediaUrl || '';
  document.getElementById('tq-category').scrollIntoView({behavior:'smooth', block:'center'});
}

function wireTriviaQuestionForm(){
  document.querySelectorAll('#tq-points button').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('#tq-points button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
  });
  document.querySelectorAll('#tq-mediatype button').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('#tq-mediatype button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tq-media-field').style.display = btn.dataset.v==="none" ? 'none' : 'block';
    };
  });
  document.getElementById('add-question').onclick = async function(){
    const category = document.getElementById('tq-category').value.trim();
    const pointsBtn = document.querySelector('#tq-points button.active');
    const points = pointsBtn ? parseInt(pointsBtn.dataset.v,10) : 100;
    const question = document.getElementById('tq-question').value.trim();
    const answer = document.getElementById('tq-answer').value.trim();
    const mediaTypeBtn = document.querySelector('#tq-mediatype button.active');
    const mediaType = mediaTypeBtn ? mediaTypeBtn.dataset.v : 'none';
    const fileInput = document.getElementById('tq-media-file');
    const file = fileInput.files[0];
    const statusEl = document.getElementById('tq-upload-status');
    const isEdit = !!this.dataset.editKey;

    if(!category || !question || !answer){ toast("عبّي الفئة والسؤال والإجابة الصحيحة"); return; }
    if(mediaType!=="none" && !file && !(isEdit && this.dataset.editMediaUrl)){ toast("اختر ملف الصورة أو الفيديو من جهازك"); return; }

    let mediaUrl = (isEdit && mediaType!=="none") ? (this.dataset.editMediaUrl||'') : '';
    if(mediaType!=="none" && file){
      const cloudSnap = await db.ref('gameData/cloudinaryConfig').get();
      const cfg = cloudSnap.exists() ? cloudSnap.val() : null;
      if(!cfg || !cfg.cloudName || !cfg.uploadPreset){
        toast("لازم تعبّي إعداد الرفع (Cloud name وUpload preset) بتبويب \"الكراسي الموسيقية\" أولاً");
        return;
      }
      if(statusEl) statusEl.textContent = "جارِ الرفع…";
      try{
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', cfg.uploadPreset);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/auto/upload`, {method:'POST', body:formData});
        const data = await res.json();
        if(!res.ok || !data.secure_url) throw new Error(data.error ? data.error.message : 'فشل الرفع');
        mediaUrl = data.secure_url;
        if(statusEl) statusEl.textContent = "تم الرفع ✅";
      }catch(err){
        console.error(err);
        if(statusEl) statusEl.textContent = "فشل الرفع — تأكد من إعداد Cloudinary";
        toast("فشل رفع الملف");
        return;
      }
    }

    const payload = {category, points, question, answer, mediaType, mediaUrl};
    if(isEdit){
      await db.ref(`gameData/triviaQuestions/${this.dataset.editKey}`).set(payload);
      delete this.dataset.editKey; delete this.dataset.editMediaUrl;
      this.textContent = '+ إضافة سؤال';
      toast("تم حفظ التعديل ✅");
    } else {
      await db.ref('gameData/triviaQuestions').push(payload);
      toast("تمت الإضافة ✅");
    }

    if(isEdit) document.getElementById('tq-category').value = '';
    document.getElementById('tq-question').value = '';
    document.getElementById('tq-answer').value = '';
    fileInput.value = '';
    document.querySelectorAll('#tq-points button').forEach(b=>b.classList.remove('active'));
    document.querySelector('#tq-points button[data-v="100"]').classList.add('active');
    document.querySelectorAll('#tq-mediatype button').forEach(b=>b.classList.remove('active'));
    document.querySelector('#tq-mediatype button[data-v="none"]').classList.add('active');
    document.getElementById('tq-media-field').style.display = 'none';
    if(statusEl) statusEl.textContent = '';
    loadTriviaQuestions();
  };
}

async function loadTriviaQuestions(){
  const list = document.getElementById('trivia-questions-list');
  const snap = await db.ref('gameData/triviaQuestions').get();
  if(!snap.exists()){ list.innerHTML = `<p style="color:var(--text-dim); font-size:13px;">لا توجد أسئلة بعد — أضف أول سؤال تحت.</p>`; TRIVIA_QUESTIONS_CACHE = {}; return; }
  const data = snap.val();
  TRIVIA_QUESTIONS_CACHE = data;
  // نجمّعها حسب الفئة عشان يسهل تشوف نواقص اللوحة (كل فئة لازم يكون فيها كذا مستوى نقاط)
  const byCategory = {};
  Object.entries(data).forEach(([key,q])=>{
    const cat = q.category || 'عام';
    (byCategory[cat] = byCategory[cat]||[]).push({key, ...q});
  });
  list.innerHTML = Object.entries(byCategory).map(([cat, qs])=>`
    <div class="cat-block open">
      <div class="cat-head">
        <div><span class="name">${escapeHTML(cat)}</span><span class="count">(${qs.length} سؤال)</span></div>
        <span class="toggle-arrow">▾</span>
      </div>
      <div class="cat-body">
        ${qs.sort((a,b)=>(a.points||0)-(b.points||0)).map(q=>`
          <div class="word-row" style="flex-wrap:wrap;">
            <div class="word" style="flex:1; min-width:200px;">
              <strong style="color:var(--violet-2);">${q.points||100} نقطة</strong> ${q.mediaType==='image'?'🖼️':q.mediaType==='video'?'🎬':''} — ${escapeHTML(q.question)}
              <div style="color:var(--text-dim); font-size:11.5px; margin-top:4px;">✅ ${escapeHTML(q.answer||'')}</div>
            </div>
            <button class="btn-icon edit-question" data-key="${escapeHTML(q.key)}" title="تعديل" style="background:rgba(124,92,255,0.14); color:var(--violet-2);">✎</button>
            <button class="del" data-key="${escapeHTML(q.key)}">حذف</button>
          </div>`).join('')}
      </div>
    </div>`).join('');
  list.querySelectorAll('.cat-head').forEach(head=>{
    head.addEventListener('click', ()=> head.closest('.cat-block').classList.toggle('open'));
  });
  list.querySelectorAll('.edit-question').forEach(btn=>{
    btn.onclick = ()=> startEditTriviaQuestion(btn.dataset.key);
  });
  list.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = async ()=>{
      await db.ref(`gameData/triviaQuestions/${btn.dataset.key}`).set(null);
      toast("تم حذف السؤال");
      loadTriviaQuestions();
    };
  });
}

    <div class="img-tile">
      <img src="${escapeHTML(c.imageUrl)}" alt="" loading="lazy">
      <button class="img-del" data-key="${escapeHTML(key)}">✕</button>
      <button class="img-edit" data-key="${escapeHTML(key)}">✎</button>

  });
  list.querySelectorAll('.img-del').forEach(btn=>{

      await db.ref(`gameData/triviaCategoryImages/${btn.dataset.key}`).set(null);
      loadTriviaCategoryImages();
    };
  });
}

/* ---- بنك الكلمات ---- */
async function loadWordBank(){
  const snap = await db.ref('gameData/wordBank').get();
  const data = snap.exists() ? snap.val() : {};
  const area = document.getElementById('wordbank-area');
  const categories = Object.keys(data);

  // تعبئة قائمة التصنيف الافتراضي بلعبة "مين المختلف؟"
  const catSelect = document.getElementById('def-different-category');
  if(catSelect){
    const defSnap = await db.ref('gameData/defaults/different/category').get();
    catSelect.innerHTML = `<option value="عشوائي">🎲 عشوائي</option>` + categories.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('');
    catSelect.value = defSnap.exists() ? defSnap.val() : "عشوائي";
    catSelect.dataset.filled = '1';
  }

  if(!categories.length){ area.innerHTML = `<p style="color:var(--text-dim); font-size:13.5px;">لا يوجد بنك كلمات محفوظ بعد — سيُنشأ تلقائياً أول مرة تُفتح فيها اللعبة.</p>`; return; }

  area.innerHTML = categories.map(cat=>{
    const words = Object.entries(data[cat]||{});
    return `
    <div class="cat-block" data-cat="${escapeHTML(cat)}">
      <div class="cat-head">
        <div><span class="name">${escapeHTML(cat)}</span><span class="count">(${words.length} كلمة)</span></div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn-icon del-cat" title="حذف التصنيف">✕</button>
          <span class="toggle-arrow">▾</span>
        </div>
      </div>
      <div class="cat-body">
        ${words.map(([key,w])=>`
          <div class="word-row" data-key="${escapeHTML(key)}">
            <div class="emoji">${escapeHTML(w.emoji||'❓')}</div>
            <div class="word">${escapeHTML(w.word||'')}</div>
            <button class="del">حذف</button>
          </div>`).join('')}
        <div class="add-word-row">
          <input class="new-word" placeholder="كلمة جديدة">
          <input class="new-emoji emoji-in" placeholder="🙂">
          <button class="btn btn-secondary btn-sm add-word-btn">+ إضافة</button>
        </div>
      </div>
    </div>`;
  }).join('');

  area.querySelectorAll('.cat-head').forEach(head=>{
    head.addEventListener('click', e=>{
      if(e.target.closest('.del-cat')) return;
      head.closest('.cat-block').classList.toggle('open');
    });
  });

  area.querySelectorAll('.del-cat').forEach(btn=>{
    btn.onclick = async e=>{
      e.stopPropagation();
      const block = btn.closest('.cat-block');
      const cat = block.dataset.cat;
      if(!confirm(`حذف تصنيف "${cat}" بالكامل؟`)) return;
      await db.ref(`gameData/wordBank/${cat}`).set(null);
      toast("تم حذف التصنيف");
      loadWordBank();
    };
  });

  area.querySelectorAll('.cat-block').forEach(block=>{
    const cat = block.dataset.cat;
    block.querySelectorAll('.word-row .del').forEach(btn=>{
      btn.onclick = async ()=>{
        const row = btn.closest('.word-row');
        const key = row.dataset.key;
        await db.ref(`gameData/wordBank/${cat}/${key}`).set(null);
        toast("تم حذف الكلمة");
        loadWordBank();
      };
    });
    const addBtn = block.querySelector('.add-word-btn');
    addBtn.onclick = async ()=>{
      const wordInput = block.querySelector('.new-word');
      const emojiInput = block.querySelector('.new-emoji');
      const word = wordInput.value.trim();
      const emoji = emojiInput.value.trim() || "❓";
      if(!word){ toast("اكتب الكلمة أولاً"); return; }
      await db.ref(`gameData/wordBank/${cat}`).push({word, emoji});
      toast("تمت الإضافة ✅");
      loadWordBank();
    };
  });
}

/* ---- بنك صور لعبة "شو معي؟" (روابط صور خارجية — بدون Firebase Storage) ---- */
function wireImageAdd(){
  document.getElementById('img-add').onclick = async ()=>{
    const urlInput = document.getElementById('img-url');
    const labelInput = document.getElementById('img-label');
    const statusEl = document.getElementById('img-upload-status');
    const url = urlInput.value.trim();
    if(!url){ toast("الصق رابط الصورة أولاً"); return; }
    if(!/^https?:\/\//i.test(url)){ toast("الرابط لازم يبدأ بـ http:// أو https://"); return; }
    try{
      await db.ref('gameData/guessImages').push({url, label:labelInput.value.trim()});
      statusEl.textContent = "تمت الإضافة ✅";
      urlInput.value = ''; labelInput.value = '';
      loadGuessImages();
    }catch(err){
      console.error(err);
      statusEl.textContent = "فشلت الإضافة — حاول مرة ثانية";
    }
  };
}

/* ---- مفتاح Pexels API وتصنيفات الصور الحقيقية ---- */
/* ---- بنك أغاني لعبة الكراسي الموسيقية ---- */
function wireSongBank(){
  document.getElementById('add-song').onclick = async ()=>{
    const urlInput = document.getElementById('new-song-url');
    const nameInput = document.getElementById('new-song-name');
    const url = urlInput.value.trim();
    const name = nameInput.value.trim();
    if(!url){ toast("الصق رابط الأغنية أولاً"); return; }
    if(!/^https?:\/\//i.test(url)){ toast("الرابط لازم يبدأ بـ http:// أو https://"); return; }
    await db.ref('gameData/chairsSongs').push({url, name});
    urlInput.value = ''; nameInput.value = '';
    toast("تمت الإضافة ✅");
    loadChairsSongs();
  };

  document.getElementById('upload-song').onclick = async ()=>{
    const fileInput = document.getElementById('song-file');
    const nameInput = document.getElementById('song-file-name');
    const statusEl = document.getElementById('song-upload-status');
    const file = fileInput.files[0];
    if(!file){ toast("اختر ملف أولاً"); return; }

    const cloudSnap = await db.ref('gameData/cloudinaryConfig').get();
    const cfg = cloudSnap.exists() ? cloudSnap.val() : null;
    if(!cfg || !cfg.cloudName || !cfg.uploadPreset){
      toast("لازم تعبّي إعداد الرفع (Cloud name وUpload preset) فوق أولاً");
      return;
    }

    statusEl.textContent = "جارِ الرفع…";
    try{
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', cfg.uploadPreset);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/auto/upload`, {method:'POST', body:formData});
      const data = await res.json();
      if(!res.ok || !data.secure_url){
        throw new Error(data.error ? data.error.message : 'فشل الرفع');
      }
      await db.ref('gameData/chairsSongs').push({url:data.secure_url, name:nameInput.value.trim()});
      statusEl.textContent = "تم الرفع ✅";
      fileInput.value = ''; nameInput.value = '';
      loadChairsSongs();
    }catch(err){
      console.error(err);
      statusEl.textContent = "فشل الرفع — تأكد من صحة Cloud name وUpload preset (ولازم يكون Signing Mode = Unsigned)";
    }
  };

  document.getElementById('save-cloudinary').onclick = async ()=>{
    const cloudName = document.getElementById('cld-name').value.trim();
    const uploadPreset = document.getElementById('cld-preset').value.trim();
    if(!cloudName || !uploadPreset){ toast("عبّي الحقلين الاثنين"); return; }
    await db.ref('gameData/cloudinaryConfig').set({cloudName, uploadPreset});
    toast("تم الحفظ ✅");
  };
}

async function loadCloudinaryConfig(){
  const snap = await db.ref('gameData/cloudinaryConfig').get();
  if(snap.exists()){
    const cfg = snap.val();
    document.getElementById('cld-name').value = cfg.cloudName||'';
    document.getElementById('cld-preset').value = cfg.uploadPreset||'';
  }
}

async function loadPhotoCategories(){
  let snap = await db.ref('gameData/photoCategories').get();
  if(!snap.exists()){
    const defaults = [
      {name:"أجهزة", query:"smartphone:هاتف, laptop computer:حاسوب, tablet computer:تابلت"},
      {name:"حيوانات", query:"cat:قطة, dog:كلب, rabbit:أرنب, horse:حصان, lion:أسد, elephant:فيل, tiger:نمر, panda:باندا, sparrow:عصفور, fish:سمكة, cow:بقرة, sheep:خروف, goat:ماعز, pig:خنزير, chicken:دجاجة, duck:بطة, monkey:قرد, bear:دب, wolf:ذئب, fox:ثعلب, deer:غزال, zebra:حمار وحشي, giraffe:زرافة, kangaroo:كنغر, koala:كوالا, camel:جمل, donkey:حمار, squirrel:سنجاب, hedgehog:قنفذ, turtle:سلحفاة, frog:ضفدع, snake:أفعى, lizard:سحلية, crocodile:تمساح, shark:قرش, dolphin:دلفين, whale:حوت, seal animal:فقمة, penguin:بطريق, owl:بومة, eagle:نسر, parrot:ببغاء, peacock:طاووس, flamingo:نحام, swan:بجعة, butterfly:فراشة, bee:نحلة, spider:عنكبوت, octopus:أخطبوط, hippopotamus:فرس النهر"}
    ];
    const seed = {};
    defaults.forEach(c=>{ seed[c.name] = c; });
    await db.ref('gameData/photoCategories').set(seed);
    snap = await db.ref('gameData/photoCategories').get();
  }
  const list = document.getElementById('photo-cats-list');
  const data = snap.val();
  list.innerHTML = Object.entries(data).map(([key,c])=>`
      <div class="word-row">
        <div class="word" style="flex:1;">${escapeHTML(c.name)} <span style="color:var(--text-dim); font-size:12px;">(${escapeHTML(c.query)})</span></div>
        <button class="btn-icon edit-cat" data-key="${escapeHTML(key)}" data-name="${escapeHTML(c.name)}" data-query="${escapeHTML(c.query)}" title="تعديل" style="background:rgba(124,92,255,0.14); color:var(--violet-2);">✎</button>
        <button class="del" data-key="${escapeHTML(key)}">حذف</button>
      </div>`).join('');
    list.querySelectorAll('.del').forEach(btn=>{
      btn.onclick = async ()=>{
        await db.ref(`gameData/photoCategories/${btn.dataset.key}`).set(null);
        toast("تم حذف التصنيف");
        loadPhotoCategories();
      };
    });
    list.querySelectorAll('.edit-cat').forEach(btn=>{
      btn.onclick = ()=>{
        document.getElementById('new-cat-name-p').value = btn.dataset.name;
        document.getElementById('new-cat-query-p').value = btn.dataset.query;
        const addBtn = document.getElementById('add-photo-cat');
        addBtn.textContent = "💾 حفظ التعديل";
        addBtn.dataset.editKey = btn.dataset.key;
        document.getElementById('new-cat-name-p').focus();
      };
    });
  document.getElementById('add-photo-cat').onclick = async function(){
    const name = document.getElementById('new-cat-name-p').value.trim();
    const query = document.getElementById('new-cat-query-p').value.trim();
    if(!name || !query){ toast("عبّي الاسم وكلمة البحث"); return; }
    if(this.dataset.editKey){
      await db.ref(`gameData/photoCategories/${this.dataset.editKey}`).set({name, query});
      delete this.dataset.editKey;
      this.textContent = "+ إضافة تصنيف";
      toast("تم حفظ التعديل ✅");
    } else {
      await db.ref('gameData/photoCategories').push({name, query});
      toast("تمت الإضافة ✅");
    }
    document.getElementById('new-cat-name-p').value = '';
    document.getElementById('new-cat-query-p').value = '';
    loadPhotoCategories();
  };
}
